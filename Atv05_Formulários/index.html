<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário de Cadastro</title>

    <style>

        body {
            background-image: url("fundo.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;

            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: #102c0a;
        }

        form {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            margin: auto;
            padding: 25px;
            border: 2px solid #cccccc;
            border-radius: 12px;
            box-sizing: border-box;
        }

        fieldset {
            border: 1px solid #bbbbbb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        legend {
            color: #0c1c2e;
            font-size: 17px;
            font-weight: bold;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .grade-campos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .campo {
            margin-bottom: 8px;
        }

        .campo-completo {
            grid-column: 1 / 3;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #bbbbbb;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #ffffff;
        }

        input:focus,
        select:focus,
        textarea:focus {
            background-color: #eaf3ff;
            border: 2px solid #19212b;
        }

        .opcoes {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }

        .opcoes label {
            display: flex;
            align-items: center;
            font-weight: normal;
            margin-bottom: 5px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 6px;
        }

        input[type="file"] {
            width: 100%;
            margin-top: 8px;
            padding: 8px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .botoes {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        button {
            width: 50%;
            padding: 12px;
            background-color: #3a701b;
            color: #ffffff;
            border: 1px solid #589216;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background-color: #000000;
            color: #ffffff;
        }

        button[type="reset"] {
            background-color: #777777;
            border-color: #777777;
        }

        @media screen and (max-width: 600px) {

            body {
                padding: 10px;
            }

            form {
                padding: 15px;
            }

            .grade-campos {
                grid-template-columns: 1fr;
            }

            .campo-completo {
                grid-column: 1;
            }

            .botoes {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <form action="#" method="post" autocomplete="on">

        <fieldset>

            <legend>Dados Pessoais</legend>

            <div class="grade-campos">

                <div class="campo campo-completo">

                    <label for="nome">Nome completo:</label>

                    <input type="text"
                           id="nome"
                           name="nome"
                           placeholder="Digite seu nome completo"
                           minlength="3"
                           required>

                </div>

                <div class="campo">

                    <label for="email">E-mail:</label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="Digite seu e-mail"
                           required>

                </div>

                <div class="campo">

                    <label for="senha">Senha:</label>

                    <input type="password"
                           id="senha"
                           name="senha"
                           placeholder="Digite sua senha"
                           minlength="6"
                           required>

                </div>

                <div class="campo campo-completo">

                    <label for="nascimento">Data de nascimento:</label>

                    <input type="date"
                           id="nascimento"
                           name="nascimento"
                           required>

                </div>

            </div>

        </fieldset>

        <fieldset>

            <legend>Informações Acadêmicas</legend>

            <label for="curso">Curso:</label>

            <select id="curso" name="curso" required>

                <option value="">Selecione um curso</option>

                <option value="engenharia">
                    Engenharia de Software
                </option>

                <option value="ads">
                    Análise e Desenvolvimento de Sistemas
                </option>

                <option value="computacao">
                    Ciência da Computação
                </option>

                <option value="sistemas">
                    Sistemas de Informação
                </option>

            </select>

        </fieldset>

        <fieldset>

            <legend>Sexo</legend>

            <div class="opcoes">

                <label>
                    <input type="radio"
                           name="sexo"
                           value="masculino"
                           required>
                    Masculino
                </label>

                <label>
                    <input type="radio"
                           name="sexo"
                           value="feminino">
                    Feminino
                </label>

                <label>
                    <input type="radio"
                           name="sexo"
                           value="outro">
                    Outro
                </label>

                <label>
                    <input type="radio"
                           name="sexo"
                           value="nao-informar">
                    Prefiro não informar
                </label>

            </div>

        </fieldset>

        <fieldset>

            <legend>Interesses</legend>

            <div class="opcoes">

                <label>
                    <input type="checkbox"
                           name="interesses"
                           value="tecnologia">
                    Tecnologia
                </label>

                <label>
                    <input type="checkbox"
                           name="interesses"
                           value="programacao">
                    Programação
                </label>

                <label>
                    <input type="checkbox"
                           name="interesses"
                           value="design">
                    Design
                </label>

                <label>
                    <input type="checkbox"
                           name="interesses"
                           value="jogos">
                    Jogos
                </label>

                <label>
                    <input type="checkbox"
                           name="interesses"
                           value="leitura">
                    Leitura
                </label>

            </div>

        </fieldset>

        <fieldset>

            <legend>Informações Adicionais</legend>

            <label for="comentarios">Comentários:</label>

            <textarea id="comentarios"
                      name="comentarios"
                      placeholder="Digite seus comentários..."></textarea>

            <label for="foto">Upload de foto:</label>

            <input type="file"
                   id="foto"
                   name="foto"
                   accept="image/*">

        </fieldset>

        <div class="botoes">

            <button type="submit">
                Enviar Cadastro
            </button>

            <button type="reset">
                Limpar Formulário
            </button>

        </div>

    </form>

</body>

</html>
